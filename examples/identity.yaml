# The OpenStack identity: a Secret of credentials and the cluster-scoped
# TerraformClusterIdentity that names it
# (https://captf.io/docs/user-guide/identities.html). Admin-applied once,
# before any cluster:
#
#   clusterctl generate yaml --from examples/identity.yaml | kubectl apply -f -
#
# Every key reaches the module's Job as an environment variable and as a
# file under /var/run/captf/credentials/<key>. The provider reads OS_CLOUD
# and OS_CLIENT_CONFIG_FILE from the environment, and clouds.yaml (and
# cacert.pem, when set) from the files.
#
# Use an application credential of a user with the member role in the
# project (plus load-balancer_member where Octavia's legacy policy needs
# it): openstack application credential create captf-<cluster>
# It needs no unrestricted flag: the modules create no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: "${OPENSTACK_IDENTITY_NAME:=openstack}"
  namespace: captf-system
type: Opaque
stringData:
  OS_CLOUD: openstack
  OS_CLIENT_CONFIG_FILE: /var/run/captf/credentials/clouds.yaml
  clouds.yaml: |
    clouds:
      openstack:
        auth_type: v3applicationcredential
        auth:
          auth_url: "${OPENSTACK_AUTH_URL}"
          application_credential_id: "${OPENSTACK_APPLICATION_CREDENTIAL_ID}"
          application_credential_secret: "${OPENSTACK_APPLICATION_CREDENTIAL_SECRET}"
        region_name: "${OPENSTACK_REGION:=RegionOne}"
        interface: public
        identity_api_version: 3
        # A private CA: add the cacert.pem key below and uncomment.
        # cacert: /var/run/captf/credentials/cacert.pem
  # cacert.pem: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: TerraformClusterIdentity
metadata:
  name: "${OPENSTACK_IDENTITY_NAME:=openstack}"
spec:
  secretRef:
    name: "${OPENSTACK_IDENTITY_NAME:=openstack}"
    namespace: captf-system
  allowedNamespaces:
    list:
    - "${NAMESPACE}"
